name: Deploy Backend Server to EC2 (Production)

on:
  push:
    branches: [prod-main]
    paths:
      - 'server/**'

jobs:
  deploy:
    name: Deploy Server via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Zip server folder
        run: zip -r server.zip server

      - name: Upload and deploy to EC2
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD: Deploy server via GitHub Actions" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=[
              "cd /home/ubuntu/hirehive-1",
              "sudo apt-get update && sudo apt-get install unzip -y",

              "cp server/.env.staging .env.staging.bak || true",
              "rm -rf server/*",
              "mkdir -p /tmp/server-deploy",
              "curl -L -o /tmp/server-deploy/source.zip https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip",
              "unzip -o /tmp/server-deploy/source.zip -d /tmp/server-deploy/",
              "cd /tmp/server-deploy",
              "FOLDER=$(find . -maxdepth 1 -type d -name '\''hirehive-1-*'\'')",
              "cp -r $FOLDER/server/* /home/ubuntu/hirehive-1/server/",
              "cd /home/ubuntu/hirehive-1",
              "mv .env.staging.bak server/.env.staging || true",
              "cd server",

              # Ensure ubuntu owns PM2 config
              "sudo chown -R ubuntu:ubuntu /home/ubuntu/.pm2",

              # Kill anything using 8008
              "PID=$(lsof -t -i:8008) && if [ -n \"$PID\" ]; then kill -9 $PID; fi",

              # Install dependencies and restart via PM2 as ubuntu
              "sudo -i -u ubuntu bash -c '\''cd /home/ubuntu/hirehive-1/server && npm ci'\''",
              "sudo -i -u ubuntu bash -c '\''export HOME=/home/ubuntu && pm2 delete hhv-staging || true'\''",
              "sudo -i -u ubuntu bash -c '\''export HOME=/home/ubuntu && pm2 start npm --name \"hhv-staging\" --cwd /home/ubuntu/hirehive-1/server -- run staging'\''",
              "sudo -i -u ubuntu bash -c '\''export HOME=/home/ubuntu && pm2 save'\''",

              # Cleanup
              "rm -rf /tmp/server-deploy"
            ]' \
            --timeout-seconds 600 \
            --output text

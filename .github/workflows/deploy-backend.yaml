name: Deploy Backend Server to EC2 (Production)

on:
  push:
    branches: [prod-main]
    paths:
      - 'server/**'

jobs:
  deploy:
    name: Deploy Server via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Zip server folder
        run: zip -r server.zip server

      - name: Upload and deploy to EC2
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD: Deploy server via GitHub Actions" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=[
              "cd /home/ubuntu/hirehive-1",
              "sudo apt-get update && sudo apt-get install unzip -y",
              "cp server/.env.staging .env.staging.bak || true",
              "rm -rf server/*",
              "mkdir -p /tmp/server-deploy",
              "curl -L -o /tmp/server-deploy/source.zip https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip",
              "unzip -o /tmp/server-deploy/source.zip -d /tmp/server-deploy/",
              "cd /tmp/server-deploy",
              "FOLDER=$(find . -maxdepth 1 -type d -name '\''hirehive-1-*'\'')",
              "cp -r $FOLDER/server/* /home/ubuntu/hirehive-1/server/",
              "cd /home/ubuntu/hirehive-1",
              "mv .env.staging.bak server/.env.staging || true",
              "cd server",
              "npm ci",
              "sudo chown -R ubuntu:ubuntu /home/ubuntu/hirehive-1 /home/ubuntu/.pm2",
              "sudo -u ubuntu bash -lc 'cd /home/ubuntu/hirehive-1/server && npm ci'",
              "sudo -u ubuntu bash -lc 'pm2 delete hhv-staging || true'",
              "sudo -u ubuntu bash -lc 'pm2 start npm --name hhv-staging -- run staging'",
              "sudo -u ubuntu bash -lc 'pm2 save'",
              "rm -rf /tmp/server-deploy"
            ]' \
            --timeout-seconds 600 \
            --output text

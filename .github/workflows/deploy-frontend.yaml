name: Deploy Frontend to S3 & CloudFront

on:
  push:
    branches:
      - prod-main  # or your deployment branch
    paths:
      - 'client/**'  # only trigger when frontend changes

jobs:
  deploy:
    name: Deploy React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client  # operate inside the client folder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the React app
        run: npm run build:staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build to S3 /frontend folder (excluding index.html)
        run: |
          aws s3 sync build/ s3://$S3_BUCKET_NAME/frontend \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,public"
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp build/index.html s3://$S3_BUCKET_NAME/frontend/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
